name: Auto-Sync Portfolio Data

on:
  schedule:
    # Runs every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/sync.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Data Sync Script
        run: |
          python scripts/sync.py

      - name: Commit and Push if Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/portfolio_data.json
          if git diff --staged --quiet; then
            echo "No changes in portfolio data."
          else
            git commit -m "chore(data): auto-sync GitHub & ORCID data [skip ci]"
            git push
          fi
